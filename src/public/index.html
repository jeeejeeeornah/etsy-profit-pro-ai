<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tax Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;height:100vh;display:flex;flex-direction:column}
#header{background:#1a1a2e;padding:14px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#header h1{color:#fff;font-size:15px;font-weight:600}
#header p{color:#a0a0c0;font-size:11px;margin-top:1px}
#data-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #eee;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.data-item{color:#666}
.data-item strong{color:#222}
#profit-val{color:#534AB7;font-weight:600}
.edit-inputs{margin-left:auto;display:flex;gap:6px}
.edit-inputs input{width:85px;font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;font-family:inherit}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user{flex-direction:row-reverse}
.mini-av{width:26px;height:26px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.user .bubble{background:#534AB7;color:#fff;border-bottom-right-radius:4px}
.assistant .bubble{background:#fff;color:#222;border:1px solid #eee;border-bottom-left-radius:4px}
.thinking{color:#999;font-style:italic}
#suggestions{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid #d0cee8;background:#fff;color:#534AB7;cursor:pointer;font-family:inherit}
.chip:hover{background:#f0eeff}
#bottom{background:#fff;border-top:1px solid #eee;padding:10px 14px;display:flex;gap:8px}
#user-input{flex:1;padding:9px 12px;font-size:14px;border:1px solid #ddd;border-radius:10px;font-family:inherit;resize:none;outline:none}
#user-input:focus{border-color:#534AB7}
#send-btn{padding:9px 18px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500}
#send-btn:disabled{opacity:0.4;cursor:default}
</style>
</head>
<body>
<div id="header">
  <div class="avatar">🤖</div>
  <div><h1>AI Tax Assistant</h1><p>German tax specialist · Powered by Claude</p></div>
</div>

    <input type="number" id="expense-in" value="13938" placeholder="Expenses">
  </div>
</div>
<div id="messages"></div>
<div id="suggestions">

  <button class="chip" onclick="ask('What business expenses can I deduct? Give me a full list.')">What can I deduct?</button>
  <button class="chip" onclick="ask('Do I need to charge VAT on my sales?')">Do I need VAT?</button>
  <button class="chip" onclick="ask('What percentage of profit should I set aside for taxes and why?')">How much to set aside?</button>
  <button class="chip" onclick="ask('What do I need to file for my Steuererklaerung and when?')">Steuererklaerung help</button>
</div>
<div id="bottom">
  <textarea id="user-input" placeholder="Ask anything about your German taxes..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMsg()">Send</button>
</div>
