<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tax Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D1117;height:100vh;display:flex;flex-direction:column}
#header{background:#1A1F2E;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2D3548}
.avatar{width:36px;height:36px;border-radius:50%;background:#6C63FF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#header h1{color:#fff;font-size:15px;font-weight:600}
#header p{color:#8B9DC3;font-size:11px;margin-top:1px}
#data-bar{background:#1A1F2E;padding:10px 16px;border-bottom:1px solid #2D3548;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.data-item{color:#8B9DC3}
.data-item strong{color:#fff}
#income-val{color:#00D4AA;font-weight:600}
#expense-val{color:#FF6B6B;font-weight:600}
#profit-val{color:#6C63FF;font-weight:600}
.edit-inputs{margin-left:auto;display:flex;gap:6px}
.edit-inputs input{width:85px;font-size:12px;padding:3px 6px;border:1px solid #2D3548;border-radius:6px;font-family:inherit;background:#0D1117;color:#fff}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user{flex-direction:row-reverse}
.mini-av{width:26px;height:26px;border-radius:50%;background:#6C63FF;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#fff}
.bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.user .bubble{background:#6C63FF;color:#fff;border-bottom-right-radius:4px}
.assistant .bubble{background:#1A1F2E;color:#fff;border:1px solid #2D3548;border-bottom-left-radius:4px}
.thinking{color:#8B9DC3;font-style:italic}
#suggestions{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid #6C63FF;background:#1A1F2E;color:#6C63FF;cursor:pointer;font-family:inherit}
.chip:hover{background:#6C63FF;color:#fff}
#bottom{background:#1A1F2E;border-top:1px solid #2D3548;padding:10px 14px;display:flex;gap:8px}
#user-input{flex:1;padding:9px 12px;font-size:14px;border:1px solid #2D3548;border-radius:10px;font-family:inherit;resize:none;outline:none;background:#0D1117;color:#fff}
#user-input:focus{border-color:#6C63FF}
#send-btn{padding:9px 18px;background:#6C63FF;color:#fff;border:1px solid #8B7FFF;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500}
#send-btn:disabled{opacity:0.4;cursor:default}
#disclaimer{background:#1A1F2E;padding:6px 16px;font-size:10px;color:#8B9DC3;text-align:center;border-top:1px solid #2D3548}
</style>
</head>
<body>
<div id="header">
  <div class="avatar">🤖</div>
  <div><h1>AI Tax Assistant</h1><p>Klarer Gewinn · Powered by Claude</p></div>
</div>
<div id="data-bar">
  <div class="data-item">Income: <strong id="income-val">€0</strong></div>
  <div class="data-item">Expenses: <strong id="expense-val">€0</strong></div>
  <div class="data-item">Profit: <strong id="profit-val">€0</strong></div>
  <div class="edit-inputs">
    <input type="number" id="income-in" value="0" placeholder="Income">
    <input type="number" id="expense-in" value="0" placeholder="Expenses">
  </div>
</div>
<div id="messages"></div>
<div id="suggestions">
  <button class="chip" onclick="ask('Am I a Kleinunternehmer based on my current income?')">Am I a Kleinunternehmer?</button>
  <button class="chip" onclick="ask('How much income tax will I roughly owe on my profit?')">How much tax do I owe?</button>
  <button class="chip" onclick="ask('What business expenses can I deduct?')">What can I deduct?</button>
  <button class="chip" onclick="ask('Do I need to charge VAT on my sales?')">Do I need VAT?</button>
  <button class="chip" onclick="ask('What percentage of profit should I set aside for taxes?')">How much to set aside?</button>
  <button class="chip" onclick="ask('What do I need to file for my Steuererklarung and when?')">Steuererklarung help</button>
</div>
<div id="bottom">
  <textarea id="user-input" placeholder="Ask anything about your German taxes..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMsg()">Send</button>
</div>
<div id="disclaimer">⚠️ General information only. Not professional tax advice. Consult a licensed Steuerberater for personal guidance.</div>
<script>
var msgsEl=document.getElementById('messages');
var inputEl=document.getElementById('user-input');
var sendBtn=document.getElementById('send-btn');
var incomeIn=document.getElementById('income-in');
var expenseIn=document.getElementById('expense-in');
var chatHistory=[];
var showSugg=true;

function fmt(n){return'€'+Number(n).toLocaleString('de-DE');}
function updateData(){
  var i=parseFloat(incomeIn.value)||0;
  var e=parseFloat(expenseIn.value)||0;
  document.getElementById('income-val').textContent=fmt(i);
  document.getElementById('expense-val').textContent=fmt(e);
  document.getElementById('profit-val').textContent=fmt(i-e);
}
incomeIn.addEventListener('input',updateData);
expenseIn.addEventListener('input',updateData);

var params=new URLSearchParams(window.location.search);
var inc=parseFloat(params.get('income'))||0;
var exp=parseFloat(params.get('expenses'))||0;
incomeIn.value=inc;
expenseIn.value=exp;
updateData();

function getSystem(){
  var i=parseFloat(incomeIn.value)||0;
  var e=parseFloat(expenseIn.value)||0;
  var p=i-e;
  return 'You are an expert AI tax assistant for German tax law for small business owners. User income: '+i+' EUR, expenses: '+e+' EUR, profit: '+p+' EUR. Give detailed helpful structured answers. Always note you are not a licensed Steuerberater. Key facts: Kleinunternehmer threshold 22000 EUR prior year. Income tax free amount 11784 EUR. Gewerbesteuer free amount 24500 EUR.';
}

function addMsg(role,text,thinking){
  var row=document.createElement('div');
  row.className='msg-row '+role;
  if(role==='assistant'){
    var av=document.createElement('div');
    av.className='mini-av';
    av.textContent='AI';
    row.appendChild(av);
  }
  var b=document.createElement('div');
  b.className='bubble'+(thinking?' thinking':'');
  b.textContent=text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  msgsEl.scrollTop=msgsEl.scrollHeight;
  return b;
}

addMsg('assistant','Hallo! I am your AI Tax Assistant for German tax law. Enter your income and expenses above, then ask me anything about Kleinunternehmer status, VAT, deductions, or your Steuererklarung.');

function ask(q){inputEl.value=q;sendMsg();}

function sendMsg(){
  var text=inputEl.value.trim();
  if(!text||sendBtn.disabled){return;}
  inputEl.value='';
  sendBtn.disabled=true;
  if(showSugg){document.getElementById('suggestions').style.display='none';showSugg=false;}
  addMsg('user',text);
  chatHistory.push({role:'user',content:text});
  var tb=addMsg('assistant','Thinking...',true);
  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system:getSystem(),
      messages:chatHistory
    })
  }).then(function(res){
    return res.json().then(function(data){
      if(!res.ok){throw new Error(data.error&&data.error.message||'Error '+res.status);}
      return data;
    });
  }).then(function(data){
    var reply=data.content&&data.content[0]&&data.content[0].text||'No response.';
    tb.textContent=reply;
    tb.classList.remove('thinking');
    chatHistory.push({role:'assistant',content:reply});
    sendBtn.disabled=false;
  }).catch(function(e){
    tb.textContent='Error: '+e.message;
    tb.classList.remove('thinking');
    chatHistory.pop();
    sendBtn.disabled=false;
  });
}

inputEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
</script>
</body>
</html>
