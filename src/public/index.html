<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tax Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;height:100vh;display:flex;flex-direction:column}
#header{background:#1a1a2e;padding:14px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#header h1{color:#fff;font-size:15px;font-weight:600}
#header p{color:#a0a0c0;font-size:11px;margin-top:1px}
#data-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #eee;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.data-item{color:#666}
.data-item strong{color:#222}
#profit-val{color:#534AB7;font-weight:600}
.edit-inputs{margin-left:auto;display:flex;gap:6px}
.edit-inputs input{width:85px;font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;font-family:inherit}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user{flex-direction:row-reverse}
.mini-av{width:26px;height:26px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.user .bubble{background:#534AB7;color:#fff;border-bottom-right-radius:4px}
.assistant .bubble{background:#fff;color:#222;border:1px solid #eee;border-bottom-left-radius:4px}
.thinking{color:#999;font-style:italic}
#suggestions{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid #d0cee8;background:#fff;color:#534AB7;cursor:pointer;font-family:inherit}
.chip:hover{background:#f0eeff}
#bottom{background:#fff;border-top:1px solid #eee;padding:10px 14px;display:flex;gap:8px}
#user-input{flex:1;padding:9px 12px;font-size:14px;border:1px solid #ddd;border-radius:10px;font-family:inherit;resize:none;outline:none}
#user-input:focus{border-color:#534AB7}
#send-btn{padding:9px 18px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500}
#send-btn:disabled{opacity:0.4;cursor:default}
</style>
</head>
<body>
<div id="header">
  <div class="avatar">🤖</div>
  <div><h1>AI Tax Assistant</h1><p>German tax specialist · Powered by Claude</p></div>
</div>
<div id="data-bar">
  <div class="data-item">Income: <strong id="d-income">€41,438</strong></div>
  <div class="data-item">Expenses: <strong id="d-expenses">€13,938</strong></div>
  <div class="data-item">Profit: <strong id="profit-val">€27,500</strong></div>
  <div class="edit-inputs">
    <input type="number" id="income-in" value="41438" placeholder="Income">
    <input type="number" id="expense-in" value="13938" placeholder="Expenses">
  </div>
</div>
<div id="messages"></div>
<div id="suggestions">
  <button class="chip" onclick="ask('Am I a Kleinunternehmer based on my current income?')">Am I a Kleinunternehmer?</button>
  <button class="chip" onclick="ask('How much income tax will I roughly owe on my profit? Walk me through it.')">How much tax do I owe?</button>
  <button class="chip" onclick="ask('What business expenses can I deduct? Give me a full list.')">What can I deduct?</button>
  <button class="chip" onclick="ask('Do I need to charge VAT on my sales?')">Do I need VAT?</button>
  <button class="chip" onclick="ask('What percentage of profit should I set aside for taxes and why?')">How much to set aside?</button>
  <button class="chip" onclick="ask('What do I need to file for my Steuererklärung and when?')">Steuererklärung help</button>
</div>
<div id="bottom">
  <textarea id="user-input" placeholder="Ask anything about your German taxes..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMsg()">Send</button>
</div>
<script>
const msgsEl=document.getElementById('messages');
const inputEl=document.getElementById('user-input');
const sendBtn=document.getElementById('send-btn');
const incomeIn=document.getElementById('income-in');
const expenseIn=document.getElementById('expense-in');
let history=[];
let showSugg=true;

function fmt(n){return'€'+Number(n).toLocaleString('de-DE');}
function updateData(){
  const i=parseFloat(incomeIn.value)||0;
  const e=parseFloat(expenseIn.value)||0;
  document.getElementById('d-income').textContent=fmt(i);
  document.getElementById('d-expenses').textContent=fmt(e);
  document.getElementById('profit-val').textContent=fmt(i-e);
}
incomeIn.addEventListener('input',updateData);
expenseIn.addEventListener('input',updateData);

function getSystem(){
  const i=parseFloat(incomeIn.value)||0;
  const e=parseFloat(expenseIn.value)||0;
  const p=i-e;
  return`You are an expert AI tax assistant specialising in German tax law for small business owners and side income earners (Nebenerwerb). You are thorough, friendly, and give detailed practical answers.\n\nUser financial data:\n- Gross income: €${i.toFixed(2)}\n- Expenses: €${e.toFixed(2)}\n- Net profit: €${p.toFixed(2)}\n\nKEY GERMAN TAX KNOWLEDGE:\n\nKLEINUNTERNEHMER (§19 UStG):\n- Under €22,000 prior year revenue AND expected under €50,000 current year → Kleinunternehmer → no VAT required\n- Must write "Gemäß §19 UStG wird keine Umsatzsteuer erhoben" on invoices\n- Can opt into VAT voluntarily to reclaim input VAT\n\nVAT (Umsatzsteuer):\n- Standard 19%, reduced 7% (books, food, some art)\n- Over threshold: register, file Umsatzsteuervoranmeldung, annual Umsatzsteuererklärung\n- EU digital services: OSS One Stop Shop may apply\n\nINCOME TAX:\n- Grundfreibetrag 2024: €11,784 tax-free\n- 14% starting rate, rising to 42% at ~€66,761, 45% above €277,826\n- Side income adds to employment income — marginal rate matters\n- Solidaritätszuschlag above ~€18,130 tax liability\n\nGEWERBESTEUER:\n- Applies to Gewerbebetrieb (online product sellers = Gewerbe)\n- Individual Freibetrag: €24,500\n- Effective ~10-15% above threshold, partially offset via §35 EStG\n\nDEDUCTIBLE EXPENSES:\n- Platform fees (Etsy, PayPal, eBay)\n- Shipping and packaging\n- Raw materials and inventory\n- Home office: €6/day flat up to €1,260/year OR proportional room costs\n- Equipment up to €800 net: immediate; above: depreciated\n- Insurance, advertising, professional books, bank fees\n- Business mileage: €0.30/km\n\nFILING:\n- Einkommensteuererklärung: July 31 deadline (October 31 with Steuerberater)\n- Anlage G (Gewerbe) or Anlage S (Freiberufler) for side income\n- EÜR: simple cash bookkeeping under €600k\n- Vorauszahlungen: quarterly if tax > €400\n\nPRACTICAL:\n- Set aside 25-30% of profit\n- Keep receipts 7 years (Aufbewahrungspflicht)\n- Separate business bank account recommended\n- SevDesk, Fastbill, Lexware for bookkeeping\n\nGive detailed, structured answers with bullet points. Use the user's real numbers. Always add a brief note that you are not a licensed Steuerberater. Respond in English unless the user writes in German.`;
}

function addMsg(role,text,thinking){
  const row=document.createElement('div');
  row.className='msg-row '+role;
  if(role==='assistant'){
    const av=document.createElement('div');
    av.className='mini-av';
    av.textContent='🤖';
    row.appendChild(av);
  }
  const b=document.createElement('div');
  b.className='bubble'+(thinking?' thinking':'');
  b.textContent=text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  msgsEl.scrollTop=msgsEl.scrollHeight;
  return b;
}

addMsg('assistant','Hallo! I\'m your AI Tax Assistant, specialised in German tax law for small businesses and side income.\n\nI can see your figures: €41,438 income, €13,938 expenses — profit of €27,500.\n\nAsk me anything: Kleinunternehmer status, VAT, deductions, how much to set aside, or Steuererklärung help. What would you like to know?');

async function ask(q){inputEl.value=q;await sendMsg();}

async function sendMsg(){
  const text=inputEl.value.trim();
  if(!text||sendBtn.disabled)return;
  inputEl.value='';
  sendBtn.disabled=true;
  if(showSugg){document.getElementById('suggestions').style.display='none';showSugg=false;}
  addMsg('user',text);
  history.push({role:'user',content:text});
  const tb=addMsg('assistant','Thinking...',true);
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
     headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:getSystem(),
        messages:history
      })
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Error '+res.status);}
    const data=await res.json();
    const reply=data.content?.[0]?.text||'No response.';
    tb.textContent=reply;
    tb.classList.remove('thinking');
    history.push({role:'assistant',content:reply});
  }catch(e){
    tb.textContent='Error: '+e.message;
    tb.classList.remove('thinking');
    history.pop();
  }
  sendBtn.disabled=false;
}

inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
</script>
</body>
</html>
